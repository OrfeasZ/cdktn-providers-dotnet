name: Update Provider Bindings

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

jobs:
  update-providers:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "9.0.x"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Generate, upload and commit provider bindings
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: python sync-providers.py --update-constraints --verify

      - name: Trigger build workflow
        if: steps.sync.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            /repos/${{ github.repository }}/actions/workflows/build.yml/dispatches \
            -f ref="${{ github.ref_name }}" \
            -f inputs[before_sha]="${{ steps.sync.outputs.before_sha }}" \
            -f inputs[after_sha]="${{ steps.sync.outputs.after_sha }}"
